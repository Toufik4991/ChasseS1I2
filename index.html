<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>L'Énigme Finale</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; touch-action: none; font-family: sans-serif; }
        #game-container { 
            position: relative; width: 100vw; height: 100vh; 
            background: url('IMG1.jpeg') center/cover no-repeat; 
        }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #canvas-layer-1 { z-index: 2; } 
        #canvas-layer-top { z-index: 3; } 
        #flash { position: absolute; width: 100%; height: 100%; background: white; opacity: 0; z-index: 10; pointer-events: none; }
        .flash-anim { animation: flash-fade 0.6s ease-out; }
        @keyframes flash-fade { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0; } }
        
        /* Effet de pulsation finale */
        .success-glow { animation: glow 2s infinite alternate; }
        @keyframes glow { from { filter: brightness(1); } to { filter: brightness(1.3) contrast(1.1); } }
    </style>
</head>
<body>
<div id="game-container">
    <div id="flash"></div>
    <canvas id="canvas-layer-1"></canvas>
    <canvas id="canvas-layer-top"></canvas>
</div>

<script>
    const cTop = document.getElementById('canvas-layer-top');
    const ctxTop = cTop.getContext('2d');
    const cMid = document.getElementById('canvas-layer-1');
    const ctxMid = cMid.getContext('2d');
    const flash = document.getElementById('flash');
    const container = document.getElementById('game-container');

    let isDrawing = false, phase = 1, locked = true, isReady = false;
    let regenActive = false; 
    let brushSize = 15, lastPoint = null;
    const maxSize = 75, growth = 0.1;

    const imgMid = new Image(); 
    imgMid.src = 'Imprim.jpg'; 

    imgMid.onload = () => {
        init();
        setTimeout(() => { 
            locked = false; isReady = true; 
            if(navigator.vibrate) navigator.vibrate(50); 
            setTimeout(() => { regenActive = true; }, 1500);
        }, 2000);
        
        setInterval(() => {
            if (isReady && !locked && phase === 1 && regenActive) {
                ctxTop.globalCompositeOperation = 'source-over';
                ctxTop.fillStyle = "rgba(0, 0, 0, 0.012)"; 
                ctxTop.fillRect(0, 0, cTop.width, cTop.height);
            }
        }, 120);
    };

    function init() {
        cTop.width = cMid.width = window.innerWidth;
        cTop.height = cMid.height = window.innerHeight;
        ctxTop.fillStyle = "#000"; 
        ctxTop.fillRect(0, 0, cTop.width, cTop.height);
        ctxMid.drawImage(imgMid, 0, 0, cMid.width, cMid.height);
    }

    function checkCompletion() {
        const currentCtx = (phase === 1) ? ctxTop : ctxMid;
        const currentCanvas = (phase === 1) ? cTop : cMid;
        const pixels = currentCtx.getImageData(0, 0, currentCanvas.width, currentCanvas.height).data;
        let clear = 0;
        for (let i = 3; i < pixels.length; i += 4096) { if (pixels[i] === 0) clear++; }
        const progress = clear / (pixels.length / 4096);
        
        if (progress > (phase === 1 ? 0.45 : 0.80)) {
            if (phase === 1) {
                locked = true; regenActive = false;
                if(navigator.vibrate) navigator.vibrate([60, 40, 60]);
                flash.classList.add('flash-anim');
                setTimeout(() => { 
                    ctxTop.clearRect(0,0,cTop.width, cTop.height);
                    cTop.style.display = 'none'; phase = 2; locked = false; 
                    flash.classList.remove('flash-anim');
                    brushSize = 20;
                }, 600);
            } else {
                ctxMid.clearRect(0, 0, cMid.width, cMid.height);
                container.classList.add('success-glow');
                if(navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 300]);
            }
        }
    }

    function scratch(x, y) {
        if (locked || !isReady) return;
        // Petite vibration haptique pendant le mouvement (très court pour ne pas saturer)
        if (isDrawing && navigator.vibrate) navigator.vibrate(10);

        const currentCtx = (phase === 1) ? ctxTop : ctxMid;
        if (brushSize < maxSize) brushSize += growth;
        currentCtx.globalCompositeOperation = 'destination-out';
        currentCtx.lineWidth = brushSize; 
        currentCtx.lineCap = 'round';
        currentCtx.lineJoin = 'round';
        if (lastPoint) { 
            currentCtx.beginPath(); currentCtx.moveTo(lastPoint.x, lastPoint.y); 
            currentCtx.lineTo(x, y); currentCtx.stroke(); 
        }
        lastPoint = { x, y };
    }

    const getPos = (e) => {
        const rect = container.getBoundingClientRect();
        const pos = e.touches ? e.touches[0] : e;
        return { x: pos.clientX - rect.left, y: pos.clientY - rect.top };
    };

    container.addEventListener('mousedown', (e) => { isDrawing = true; lastPoint = getPos(e); scratch(lastPoint.x, lastPoint.y); });
    window.addEventListener('mousemove', (e) => { if (isDrawing) scratch(getPos(e).x, getPos(e).y); });
    window.addEventListener('mouseup', () => { isDrawing = false; checkCompletion(); });
    container.addEventListener('touchstart', (e) => { e.preventDefault(); isDrawing = true; lastPoint = getPos(e); }, {passive: false});
    container.addEventListener('touchmove', (e) => { e.preventDefault(); if (isDrawing) scratch(getPos(e).x, getPos(e).y); }, {passive: false});
    container.addEventListener('touchend', () => { isDrawing = false; checkCompletion(); });
    window.addEventListener('resize', init);
</script>
</body>
</html>
