<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Le Mystère à Double Voile</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #000;
            overflow: hidden;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 320px;
            height: 450px;
            /* IMAGE 2 (FOND) - Floue */
            background-image: url('Imprim.jpg');
            background-size: cover;
            background-position: center;
            filter: blur(15px);
            border-radius: 8px;
        }

        /* IMAGE 1 (MILIEU) - Floue */
        #canvas-layer-1 {
            position: absolute;
            top: 0; left: 0;
            z-index: 2;
            filter: blur(8px);
        }

        /* VOILE NOIR (DESSUS) - Flou */
        #canvas-layer-top {
            position: absolute;
            top: 0; left: 0;
            z-index: 3;
            filter: blur(4px);
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="canvas-layer-1"></canvas>
    <canvas id="canvas-layer-top"></canvas>
</div>

<script>
    const container = document.getElementById('game-container');
    const cTop = document.getElementById('canvas-layer-top');
    const ctxTop = cTop.getContext('2d');
    const cMid = document.getElementById('canvas-layer-1');
    const ctxMid = cMid.getContext('2d');

    let isDrawing = false;
    let lastPoint = null;
    let brushSize = 4;
    const minBrush = 4;
    const maxBrush = 50;
    const growthSpeed = 0.15; // Agrandissement très lent

    const img1 = new Image();
    img1.src = 'IMG1.jpeg';

    img1.onload = function() {
        [cTop, cMid].forEach(canvas => {
            canvas.width = container.offsetWidth;
            canvas.height = container.offsetHeight;
        });

        // Setup Layer 1 (Image 1)
        ctxMid.drawImage(img1, 0, 0, cMid.width, cMid.height);

        // Setup Layer Top (Voile Noir)
        ctxTop.fillStyle = "#000000";
        ctxTop.fillRect(0, 0, cTop.width, cTop.height);
    };

    function scratch(x, y, ctx) {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';

        if (brushSize < maxBrush) {
            brushSize += growthSpeed;
        }

        ctx.lineWidth = brushSize;

        if (lastPoint) {
            ctx.beginPath();
            ctx.moveTo(lastPoint.x, lastPoint.y);
            ctx.lineTo(x, y);
            ctx.stroke();
        } else {
            ctx.beginPath();
            ctx.arc(x, y, brushSize / 2, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function handlePointer(e) {
        if (!isDrawing) return;
        if (e.cancelable) e.preventDefault();

        const rect = cTop.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const x = clientX - rect.left;
        const y = clientY - rect.top;

        // On gratte les deux couches simultanément
        // Mais comme elles sont superposées, l'effet visuel sera progressif
        scratch(x, y, ctxTop);
        scratch(x, y, ctxMid);

        lastPoint = { x, y };
    }

    const start = (e) => {
        isDrawing = true;
        brushSize = minBrush;
        lastPoint = null;
        handlePointer(e);
    };

    const stop = () => {
        isDrawing = false;
        lastPoint = null;
        brushSize = minBrush;
    };

    cTop.addEventListener('mousedown', start);
    window.addEventListener('mousemove', handlePointer);
    window.addEventListener('mouseup', stop);

    cTop.addEventListener('touchstart', start, { passive: false });
    cTop.addEventListener('touchmove', handlePointer, { passive: false });
    window.addEventListener('touchend', stop);

</script>
</body>
</html>
