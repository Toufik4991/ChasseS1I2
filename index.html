<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Expérience de Grattage Séquentiel</title>
    <style>
        body {
            display: flex; justify-content: center; align-items: center;
            height: 100vh; margin: 0; background-color: #050505;
            overflow: hidden; touch-action: none;
        }

        #game-container {
            position: relative; width: 320px; height: 450px;
            background-image: url('Imprim.jpg'); /* IMAGE 2 (FOND FINAL) */
            background-size: cover; background-position: center;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        canvas { position: absolute; top: 0; left: 0; border-radius: 12px; }
        #canvas-layer-1 { z-index: 2; } /* Image 1 */
        #canvas-layer-top { z-index: 3; } /* Noir */

        #brush-cursor {
            position: absolute; border: 1.5px solid rgba(255,255,255,0.8); 
            border-radius: 50%; pointer-events: none; 
            transform: translate(-50%, -50%); display: none; 
            z-index: 100; mix-blend-mode: difference;
        }

        @keyframes shake {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            25% { transform: translate(-51%, -49%) rotate(0.5deg); }
            50% { transform: translate(-49%, -51%) rotate(-0.5deg); }
            100% { transform: translate(-50%, -50%) rotate(0deg); }
        }

        #flash {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: white; opacity: 0; z-index: 10; pointer-events: none;
            border-radius: 12px;
        }
        .flash-anim { animation: flash-fade 0.8s ease-out; }
        @keyframes flash-fade { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0; } }
    </style>
</head>
<body>

<div id="game-container">
    <div id="flash"></div>
    <div id="brush-cursor"></div>
    <canvas id="canvas-layer-1"></canvas>
    <canvas id="canvas-layer-top"></canvas>
</div>

<script>
    const container = document.getElementById('game-container');
    const cTop = document.getElementById('canvas-layer-top');
    const ctxTop = cTop.getContext('2d');
    const cMid = document.getElementById('canvas-layer-1');
    const ctxMid = cMid.getContext('2d');
    const flash = document.getElementById('flash');
    const cursor = document.getElementById('brush-cursor');

    let isDrawing = false;
    let lastPoint = null;
    let brushSize = 2; 
    let phase = 1; 
    let locked = false; 
    
    const minSize = 2;
    const maxSize = 110;
    const growth = 0.03; // Croissance lente

    const img1 = new Image();
    img1.src = 'IMG1.jpeg';

    img1.onload = () => {
        [cTop, cMid].forEach(c => { 
            c.width = container.offsetWidth; 
            c.height = container.offsetHeight; 
        });
        ctxMid.drawImage(img1, 0, 0, cMid.width, cMid.height);
        ctxTop.fillStyle = "black";
        ctxTop.fillRect(0, 0, cTop.width, cTop.height);
    };

    function checkCompletion(ctx, canvas) {
        const pixels = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
        let clear = 0;
        const step = 400;
        for (let i = 3; i < pixels.length; i += step) {
            if (pixels[i] === 0) clear++;
        }
        const progress = clear / (pixels.length / step);

        if (progress > 0.95) {
            if (phase === 1) {
                completePhase1();
            } else if (phase === 2) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }
    }

    function completePhase1() {
        locked = true;
        flash.classList.add('flash-anim');
        ctxTop.clearRect(0, 0, cTop.width, cTop.height); 
        cursor.style.display = 'none';
        
        setTimeout(() => {
            flash.classList.remove('flash-anim');
            cTop.style.display = 'none'; 
            phase = 2; 
            setTimeout(() => { locked = false; }, 5000); 
        }, 800);
    }

    function scratch(x, y) {
        if (locked) return;
        
        const currentCtx = (phase === 1) ? ctxTop : ctxMid;

        if (brushSize < maxSize) brushSize += growth;
        
        // Tremblement du curseur
        if (brushSize > 20) {
            cursor.style.animation = `shake 0.1s infinite`;
        } else {
            cursor.style.animation = 'none';
        }

        cursor.style.width = brushSize + 'px';
        cursor.style.height = brushSize + 'px';
        cursor.style.left = x + 'px';
        cursor.style.top = y + 'px';
        cursor.style.display = 'block';

        currentCtx.globalCompositeOperation = 'destination-out';
        currentCtx.lineJoin = 'round';
        currentCtx.lineCap = 'round';
        currentCtx.lineWidth = brushSize;

        if (lastPoint) {
            currentCtx.beginPath();
            currentCtx.moveTo(lastPoint.x, lastPoint.y);
            currentCtx.lineTo(x, y);
            currentCtx.stroke();
        }
        lastPoint = { x, y };

        if (Math.random() > 0.9) checkCompletion(currentCtx, phase === 1 ? cTop : cMid);
    }

    function getPos(e) {
        const rect = container.getBoundingClientRect();
        const pos = e.touches ? e.touches[0] : e;
        return { x: pos.clientX - rect.left, y: pos.clientY - rect.top };
    }

    const onStart = (e) => {
        if (locked) return;
        isDrawing = true;
        brushSize = minSize;
        const p = getPos(e);
        lastPoint = p;
        scratch(p.x, p.y);
    };

    const onMove = (e) => {
        if (!isDrawing || locked) return;
        if (e.cancelable) e.preventDefault();
        const p = getPos(e);
        scratch(p.x, p.y);
    };

    const onStop = () => {
        isDrawing = false;
        lastPoint = null;
        cursor.style.display = 'none';
        if (!locked) {
            const currentCtx = (phase === 1) ? ctxTop : ctxMid;
            checkCompletion(currentCtx, phase === 1 ? cTop : cMid);
        }
    };

    container.addEventListener('mousedown', onStart);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onStop);
    container.addEventListener('touchstart', onStart, {passive: false});
    window.addEventListener('touchmove', onMove, {passive: false});
    window.addEventListener('touchend', onStop);

</script>
</body>
</html>
