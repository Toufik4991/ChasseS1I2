<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>L'Énigme Finale</title>
    <style>
        body {
            display: flex; justify-content: center; align-items: center;
            height: 100vh; margin: 0; background-color: #000;
            overflow: hidden; touch-action: none;
        }

        #game-container {
            position: relative; width: 320px; height: 450px;
            background-image: url('Imprim.jpg');
            background-size: cover; background-position: center;
            border-radius: 8px; 
            filter: blur(30px); /* Fond ultra flou au début */
        }

        canvas { position: absolute; top: 0; left: 0; }
        
        /* On utilise le filtre CSS pour la proportionnalité du flou */
        #canvas-layer-1 { z-index: 2; filter: blur(20px); } 
        #canvas-layer-top { z-index: 3; }

        #flash {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: white; opacity: 0; z-index: 10; pointer-events: none;
        }

        .flash-anim { animation: flash-effect 0.7s ease-out; }
        @keyframes flash-effect {
            0% { opacity: 0; } 25% { opacity: 1; } 100% { opacity: 0; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="flash"></div>
    <canvas id="canvas-layer-1"></canvas>
    <canvas id="canvas-layer-top"></canvas>
</div>

<script>
    const container = document.getElementById('game-container');
    const cTop = document.getElementById('canvas-layer-top');
    const ctxTop = cTop.getContext('2d');
    const cMid = document.getElementById('canvas-layer-1');
    const ctxMid = cMid.getContext('2d');
    const flash = document.getElementById('flash');

    let isDrawing = false;
    let lastPoint = null;
    let brushSize = 4;
    let phase = 1; 
    let isCoolingDown = false;
    
    const growthSpeed = 0.20; 
    const minBrush = 4;
    const maxBrush = 80;

    const img1 = new Image();
    img1.src = 'IMG1.jpeg';

    img1.onload = function() {
        [cTop, cMid].forEach(c => { 
            c.width = container.offsetWidth; 
            c.height = container.offsetHeight; 
        });
        
        // On dessine l'image 1 normalement (le flou est géré par le CSS au-dessus)
        ctxMid.drawImage(img1, 0, 0, cMid.width, cMid.height);
        
        // Initialisation Voile Noir
        ctxTop.fillStyle = "#000000";
        ctxTop.fillRect(0, 0, cTop.width, cTop.height);
    };

    function updateBlurLevels() {
        if (isCoolingDown) return;

        // On définit quel calque analyser pour calculer la progression
        const activeCanvas = (phase === 1) ? cTop : cMid;
        const activeCtx = (phase === 1) ? ctxTop : ctxMid;
        
        const pixels = activeCtx.getImageData(0, 0, activeCanvas.width, activeCanvas.height).data;
        let transparent = 0;
        const step = 200; 

        for (let i = 3; i < pixels.length; i += step) { 
            if (pixels[i] === 0) transparent++; 
        }
        
        const progress = transparent / (pixels.length / step);
        const remaining = 1 - progress;

        if (phase === 1) {
            // L'Image 1 devient nette selon le grattage du NOIR
            const blurVal = Math.max(0, remaining * 20);
            cMid.style.filter = `blur(${blurVal}px)`;
            cTop.style.opacity = remaining; // Le noir s'efface aussi en opacité

            if (progress > 0.96) {
                triggerFlash();
                phase = 2;
                isCoolingDown = true;
                cTop.style.display = 'none';
                cMid.style.filter = 'blur(0px)'; // Fixe l'image 1 à 100% net
                setTimeout(() => { isCoolingDown = false; }, 5000);
            }
        } else {
            // L'Image 2 devient nette selon le grattage de l'IMAGE 1
            const blurVal = Math.max(0, remaining * 30);
            container.style.filter = `blur(${blurVal}px)`;
        }
    }

    function triggerFlash() {
        flash.classList.add('flash-anim');
        setTimeout(() => flash.classList.remove('flash-anim'), 700);
    }

    function scratch(x, y) {
        // En phase 1 on gratte le noir, en phase 2 on gratte l'image 1
        const currentCtx = (phase === 1) ? ctxTop : ctxMid;

        if (brushSize < maxBrush) brushSize += growthSpeed;

        currentCtx.globalCompositeOperation = 'destination-out';
        currentCtx.lineJoin = 'round'; 
        currentCtx.lineCap = 'round';
        currentCtx.lineWidth = brushSize;

        if (lastPoint) {
            currentCtx.beginPath(); 
            currentCtx.moveTo(lastPoint.x, lastPoint.y);
            currentCtx.lineTo(x, y); 
            currentCtx.stroke();
        } else {
            currentCtx.beginPath(); 
            currentCtx.arc(x, y, brushSize/2, 0, Math.PI*2); 
            currentCtx.fill();
        }
        lastPoint = { x, y };
        
        updateBlurLevels();
    }

    const handleInput = (e) => {
        if (!isDrawing) return;
        if (e.cancelable) e.preventDefault();
        const rect = cMid.getBoundingClientRect();
        const pos = e.touches ? e.touches[0] : e;
        const x = pos.clientX - rect.left;
        const y = pos.clientY - rect.top;
        scratch(x, y);
    };

    const start = (e) => { 
        isDrawing = true; 
        brushSize = minBrush; 
        lastPoint = null; 
        handleInput(e); 
    };
    
    const stop = () => { 
        isDrawing = false; 
        lastPoint = null; 
        brushSize = minBrush; 
    };

    // Attribution des événements
    [cTop, cMid].forEach(c => {
        c.addEventListener('mousedown', start);
        c.addEventListener('touchstart', start, {passive: false});
    });

    window.addEventListener('mousemove', handleInput);
    window.addEventListener('touchmove', handleInput, {passive: false});
    window.addEventListener('mouseup', stop);
    window.addEventListener('touchend', stop);

</script>
</body>
</html>
