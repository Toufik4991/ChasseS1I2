<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Énigme Finale - Version Fluide</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; touch-action: none; }
        #game-container { 
            position: relative; width: 100vw; height: 100vh; 
            background: url('IMG1.jpeg') center/cover no-repeat; 
        }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #canvas-layer-1 { z-index: 2; } 
        #canvas-layer-top { z-index: 3; } 
    </style>
</head>
<body>
<div id="game-container">
    <canvas id="canvas-layer-1"></canvas>
    <canvas id="canvas-layer-top"></canvas>
</div>

<script>
    const cTop = document.getElementById('canvas-layer-top');
    const ctxTop = cTop.getContext('2d');
    const cMid = document.getElementById('canvas-layer-1');
    const ctxMid = cMid.getContext('2d');
    const container = document.getElementById('game-container');

    let isDrawing = false, phase = 1, locked = true, isReady = false;
    let regenActive = false; 
    let brushSize = 25, lastPoint = null;
    const maxSize = 90; 

    const imgMid = new Image(); 
    imgMid.src = 'Imprim.jpg'; 

    imgMid.onload = () => {
        init();
        setTimeout(() => { 
            locked = false; isReady = true; 
            setTimeout(() => { regenActive = true; }, 2300);
        }, 2000);
        
        setInterval(() => {
            if (isReady && !locked && phase === 1 && regenActive) {
                ctxTop.globalCompositeOperation = 'source-over';
                ctxTop.fillStyle = "rgba(0, 0, 0, 0.035)"; 
                ctxTop.fillRect(0, 0, cTop.width, cTop.height);
            }
        }, 120);
    };

    function init() {
        cTop.width = cMid.width = window.innerWidth;
        cTop.height = cMid.height = window.innerHeight;
        ctxTop.fillStyle = "#000"; 
        ctxTop.fillRect(0, 0, cTop.width, cTop.height);
        ctxMid.drawImage(imgMid, 0, 0, cMid.width, cMid.height);
    }

    function checkCompletion() {
        const currentCtx = (phase === 1) ? ctxTop : ctxMid;
        const currentCanvas = (phase === 1) ? cTop : cMid;
        
        // On prend un échantillon plus petit pour être plus rapide et moins strict
        const pixels = currentCtx.getImageData(0, 0, currentCanvas.width, currentCanvas.height).data;
        let clear = 0;
        const step = 8192; // On saute plus de pixels pour lisser le résultat
        
        for (let i = 3; i < pixels.length; i += step) { 
            if (pixels[i] < 150) clear++; // Si l'opacité est faible, on considère que c'est propre
        }
        
        const progress = clear / (pixels.length / step);
        
        // SEUIL À 25% : Beaucoup plus gratifiant visuellement
        const threshold = (phase === 1) ? 0.25 : 0.70;

        if (progress > threshold) {
            if (phase === 1) {
                locked = true; regenActive = false;
                ctxTop.clearRect(0,0,cTop.width, cTop.height);
                cTop.style.display = 'none'; 
                phase = 2; locked = false;
            } else {
                ctxMid.clearRect(0, 0, cMid.width, cMid.height);
            }
        }
    }

    function scratch(x, y) {
        if (locked || !isReady) return;
        const currentCtx = (phase === 1) ? ctxTop : ctxMid;
        if (brushSize < maxSize) brushSize += 0.2;

        currentCtx.globalCompositeOperation = 'destination-out';
        currentCtx.lineWidth = brushSize; 
        currentCtx.lineCap = 'round';
        currentCtx.lineJoin = 'round';
        
        if (lastPoint) { 
            currentCtx.beginPath(); 
            currentCtx.moveTo(lastPoint.x, lastPoint.y); 
            currentCtx.lineTo(x, y); 
            currentCtx.stroke(); 
        }
        lastPoint = { x, y };
    }

    const getPos = (e) => {
        const rect = container.getBoundingClientRect();
        const pos = e.touches ? e.touches[0] : e;
        return { x: pos.clientX - rect.left, y: pos.clientY - rect.top };
    };

    container.addEventListener('touchstart', (e) => { 
        e.preventDefault(); isDrawing = true; lastPoint = getPos(e); scratch(lastPoint.x, lastPoint.y);
    }, {passive: false});
    container.addEventListener('touchmove', (e) => { 
        e.preventDefault(); if (isDrawing) scratch(getPos(e).x, getPos(e).y); 
    }, {passive: false});
    container.addEventListener('touchend', () => { isDrawing = false; checkCompletion(); });
    window.addEventListener('resize', init);
</script>
</body>
</html>
