<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Système de Flou Dynamique</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #000;
            overflow: hidden;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 320px;
            height: 450px;
            /* IMAGE 2 (FOND) */
            background-image: url('Imprim.jpg');
            background-size: cover;
            background-position: center;
            border-radius: 8px;
            transition: filter 0.2s ease;
        }

        /* IMAGE 1 (MILIEU) */
        #canvas-layer-1 {
            position: absolute;
            top: 0; left: 0;
            z-index: 2;
            transition: filter 0.2s ease;
        }

        /* VOILE NOIR (DESSUS) */
        #canvas-layer-top {
            position: absolute;
            top: 0; left: 0;
            z-index: 3;
            transition: opacity 0.2s ease;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="canvas-layer-1"></canvas>
    <canvas id="canvas-layer-top"></canvas>
</div>

<script>
    const container = document.getElementById('game-container');
    const cTop = document.getElementById('canvas-layer-top');
    const ctxTop = cTop.getContext('2d');
    const cMid = document.getElementById('canvas-layer-1');
    const ctxMid = cMid.getContext('2d');

    let isDrawing = false;
    let lastPoint = null;
    let brushSize = 4;
    const minBrush = 4;
    const maxBrush = 60;
    const growthSpeed = 0.12; // Agrandissement lent

    const img1 = new Image();
    img1.src = 'IMG1.jpeg';

    img1.onload = function() {
        [cTop, cMid].forEach(canvas => {
            canvas.width = container.offsetWidth;
            canvas.height = container.offsetHeight;
        });

        ctxMid.drawImage(img1, 0, 0, cMid.width, cMid.height);
        ctxTop.fillStyle = "#000000";
        ctxTop.fillRect(0, 0, cTop.width, cTop.height);
        
        updateBlur(0); // Initialisation à 0% gratté
    };

    function updateBlur(percent) {
        // percent va de 0 (rien gratté) à 1 (tout gratté)
        const reversePercent = 1 - percent; 
        
        // Calcul des intensités de flou (Max flou : 20px pour le fond, 15px pour img1)
        const blurFond = (reversePercent * 20).toFixed(1);
        const blurImg1 = (reversePercent * 15).toFixed(1);
        const opacityTop = (reversePercent).toFixed(2);

        container.style.filter = `blur(${blurFond}px)`;
        cMid.style.filter = `blur(${blurImg1}px)`;
        cTop.style.opacity = opacityTop;
    }

    function calculateProgress() {
        // On analyse la couche du milieu pour savoir ce qui a été retiré
        const pixels = ctxMid.getImageData(0, 0, cMid.width, cMid.height).data;
        let transparent = 0;
        // On saute des pixels pour optimiser les performances (i += 4 * pas)
        for (let i = 3; i < pixels.length; i += 80) {
            if (pixels[i] === 0) transparent++;
        }
        const totalSampled = pixels.length / 80;
        updateBlur(transparent / totalSampled);
    }

    function scratch(x, y, ctx) {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';

        if (brushSize < maxBrush) brushSize += growthSpeed;
        ctx.lineWidth = brushSize;

        if (lastPoint) {
            ctx.beginPath();
            ctx.moveTo(lastPoint.x, lastPoint.y);
            ctx.lineTo(x, y);
            ctx.stroke();
        } else {
            ctx.beginPath();
            ctx.arc(x, y, brushSize / 2, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function handlePointer(e) {
        if (!isDrawing) return;
        if (e.cancelable) e.preventDefault();

        const rect = cTop.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const x = clientX - rect.left;
        const y = clientY - rect.top;

        scratch(x, y, ctxTop);
        scratch(x, y, ctxMid);

        lastPoint = { x, y };
        
        // On calcule la progression toutes les quelques frames
        if (Math.random() > 0.9) calculateProgress();
    }

    const start = (e) => {
        isDrawing = true;
        brushSize = minBrush;
        lastPoint = null;
        handlePointer(e);
    };

    const stop = () => {
        isDrawing = false;
        lastPoint = null;
        brushSize = minBrush;
        calculateProgress(); // Calcul final au relâchement
    };

    cTop.addEventListener('mousedown', start);
    window.addEventListener('mousemove', handlePointer);
    window.addEventListener('mouseup', stop);

    cTop.addEventListener('touchstart', start, { passive: false });
    cTop.addEventListener('touchmove', handlePointer, { passive: false });
    window.addEventListener('touchend', stop);

</script>
</body>
</html>
