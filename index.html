<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Expérience Tactile Précise</title>
    <style>
        body {
            display: flex; justify-content: center; align-items: center;
            height: 100vh; margin: 0; background-color: #050505;
            overflow: hidden; touch-action: none;
        }

        #game-container {
            position: relative; width: 320px; height: 450px;
            background-image: url('Imprim.jpg'); /* IMAGE 2 (FOND) */
            background-size: cover; background-position: center;
            border-radius: 12px;
            filter: blur(25px); /* Flou initial Image 2 */
        }

        canvas { position: absolute; top: 0; left: 0; border-radius: 12px; }
        #canvas-layer-1 { z-index: 2; filter: blur(25px); } /* IMAGE 1 */
        #canvas-layer-top { z-index: 3; } /* VOILE NOIR */

        #brush-cursor {
            position: absolute; border: 1px solid rgba(255,255,255,0.8); 
            border-radius: 50%; pointer-events: none; 
            transform: translate(-50%, -50%); display: none; 
            z-index: 100; mix-blend-mode: difference;
        }

        @keyframes shake {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            25% { transform: translate(-52%, -48%) rotate(1deg); }
            50% { transform: translate(-48%, -52%) rotate(-1deg); }
            100% { transform: translate(-50%, -50%) rotate(0deg); }
        }

        #flash {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: white; opacity: 0; z-index: 10; pointer-events: none;
        }
        .flash-anim { animation: flash-fade 0.8s ease-out; }
        @keyframes flash-fade { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0; } }
    </style>
</head>
<body>

<div id="game-container">
    <div id="flash"></div>
    <div id="brush-cursor"></div>
    <canvas id="canvas-layer-1"></canvas>
    <canvas id="canvas-layer-top"></canvas>
</div>

<script>
    const container = document.getElementById('game-container');
    const cTop = document.getElementById('canvas-layer-top');
    const ctxTop = cTop.getContext('2d');
    const cMid = document.getElementById('canvas-layer-1');
    const ctxMid = cMid.getContext('2d');
    const flash = document.getElementById('flash');
    const cursor = document.getElementById('brush-cursor');

    let isDrawing = false;
    let lastPoint = null;
    let brushSize = 2; 
    let phase = 1; 
    let locked = false; 
    
    const minSize = 2;  
    const maxSize = 120; 
    const growth = 0.025; // Croissance divisée par 5 pour être ultra lente

    const img1 = new Image();
    img1.src = 'IMG1.jpeg';

    img1.onload = () => {
        [cTop, cMid].forEach(c => { 
            c.width = container.offsetWidth; 
            c.height = container.offsetHeight; 
        });
        ctxMid.drawImage(img1, 0, 0, cMid.width, cMid.height);
        ctxTop.fillStyle = "black";
        ctxTop.fillRect(0, 0, cTop.width, cTop.height);
    };

    function calculateBlur(progress) {
        // Logique : Très flou (<25%), puis proportionnel jusqu'à 95%
        if (progress < 0.25) return 25;
        if (progress > 0.95) return 0;
        // Règle de trois entre 0.25 (25px) et 0.95 (0px)
        return 25 * (1 - (progress - 0.25) / 0.70);
    }

    function updateVisuals() {
        if (locked) return;

        const currentCtx = (phase === 1) ? ctxTop : ctxMid;
        const pixels = currentCtx.getImageData(0, 0, cMid.width, cMid.height).data;
        let clear = 0;
        const step = 400; 
        for (let i = 3; i < pixels.length; i += step) {
            if (pixels[i] === 0) clear++;
        }
        const progress = clear / (pixels.length / step);

        const blurVal = calculateBlur(progress);

        if (phase === 1) {
            cMid.style.filter = `blur(${blurVal}px)`;
            if (progress > 0.95) {
                completePhase1();
            }
        } else {
            container.style.filter = `blur(${blurVal}px)`;
            if (progress > 0.95) {
                ctxMid.clearRect(0, 0, cMid.width, cMid.height);
            }
        }
    }

    function completePhase1() {
        locked = true;
        flash.classList.add('flash-anim');
        ctxTop.clearRect(0, 0, cTop.width, cTop.height);
        cursor.style.display = 'none';
        
        setTimeout(() => {
            flash.classList.remove('flash-anim');
            cTop.style.display = 'none';
            phase = 2;
            cMid.style.filter = "blur(0px)"; // Image 1 devient nette pour servir de base
            setTimeout(() => { locked = false; }, 5000); 
        }, 800);
    }

    function scratch(x, y) {
        if (locked) return;
        const currentCtx = (phase === 1) ? ctxTop : ctxMid;

        if (brushSize < maxSize) brushSize += growth;
        
        // Tremblement
        if (brushSize > 25) {
            cursor.style.animation = `shake 0.1s infinite`;
        } else {
            cursor.style.animation = 'none';
        }

        cursor.style.width = brushSize + 'px';
        cursor.style.height = brushSize + 'px';
        cursor.style.left = x + 'px';
        cursor.style.top = y + 'px';
        cursor.style.display = 'block';

        currentCtx.globalCompositeOperation = 'destination-out';
        currentCtx.lineJoin = 'round';
        currentCtx.lineCap = 'round';
        currentCtx.lineWidth = brushSize;

        if (lastPoint) {
            currentCtx.beginPath();
            currentCtx.moveTo(lastPoint.x, lastPoint.y);
            currentCtx.lineTo(x, y);
            currentCtx.stroke();
        }
        lastPoint = { x, y };

        if (Math.random() > 0.9) updateVisuals();
    }

    const onStart = (e) => {
        if (locked) return;
        isDrawing = true;
        brushSize = minSize; 
        const rect = container.getBoundingClientRect();
        const pos = e.touches ? e.touches[0] : e;
        const p = { x: pos.clientX - rect.left, y: pos.clientY - rect.top };
        lastPoint = p;
        scratch(p.x, p.y);
    };

    const onMove = (e) => {
        if (!isDrawing || locked) return;
        if (e.cancelable) e.preventDefault();
        const rect = container.getBoundingClientRect();
        const pos = e.touches ? e.touches[0] : e;
        scratch(pos.clientX - rect.left, pos.clientY - rect.top);
    };

    const onStop = () => {
        isDrawing = false;
        lastPoint = null;
        cursor.style.display = 'none';
    };

    container.addEventListener('mousedown', onStart);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onStop);
    container.addEventListener('touchstart', onStart, {passive: false});
    window.addEventListener('touchmove', onMove, {passive: false});
    window.addEventListener('touchend', onStop);
</script>
</body>
</html>
