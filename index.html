<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Expérience de Grattage Séquentiel</title>
    <style>
        body {
            display: flex; justify-content: center; align-items: center;
            height: 100vh; margin: 0; background-color: #050505;
            overflow: hidden; touch-action: none; font-family: sans-serif;
        }

        #game-container {
            position: relative; width: 320px; height: 450px;
            background-image: url('Imprim.jpg'); /* IMAGE 2 (FOND FINAL) */
            background-size: cover; background-position: center;
            border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        canvas { position: absolute; top: 0; left: 0; border-radius: 12px; }
        #canvas-layer-1 { z-index: 2; } /* Image 1 */
        #canvas-layer-top { z-index: 3; } /* Noir */

        /* Curseur visuel */
        #brush-cursor {
            position: absolute; border: 2px solid white; border-radius: 50%;
            pointer-events: none; transform: translate(-50%, -50%);
            display: none; z-index: 100; mix-blend-mode: difference;
        }

        /* Flash blanc */
        #flash {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: white; opacity: 0; z-index: 10; pointer-events: none;
            border-radius: 12px;
        }
        .flash-anim { animation: flash-fade 0.8s ease-out; }
        @keyframes flash-fade { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0; } }
    </style>
</head>
<body>

<div id="game-container">
    <div id="flash"></div>
    <div id="brush-cursor"></div>
    <canvas id="canvas-layer-1"></canvas>
    <canvas id="canvas-layer-top"></canvas>
</div>

<script>
    const container = document.getElementById('game-container');
    const cTop = document.getElementById('canvas-layer-top');
    const ctxTop = cTop.getContext('2d');
    const cMid = document.getElementById('canvas-layer-1');
    const ctxMid = cMid.getContext('2d');
    const flash = document.getElementById('flash');
    const cursor = document.getElementById('brush-cursor');

    let isDrawing = false;
    let lastPoint = null;
    let brushSize = 10;
    let phase = 1; // 1 = Gratter Noir, 2 = Gratter Image 1
    let locked = false; // Bloqueur de 5 secondes
    
    const minSize = 10;
    const maxSize = 80;
    const growth = 0.5; // Vitesse de croissance du rond

    const img1 = new Image();
    img1.src = 'IMG1.jpeg';

    img1.onload = () => {
        [cTop, cMid].forEach(c => { 
            c.width = container.offsetWidth; 
            c.height = container.offsetHeight; 
        });
        
        // Phase 1 : Image 1 est cachée sous le noir
        ctxMid.drawImage(img1, 0, 0, cMid.width, cMid.height);
        ctxTop.fillStyle = "black";
        ctxTop.fillRect(0, 0, cTop.width, cTop.height);
    };

    function checkCompletion(ctx, canvas) {
        const pixels = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
        let clear = 0;
        for (let i = 3; i < pixels.length; i += 400) {
            if (pixels[i] === 0) clear++;
        }
        const progress = clear / (pixels.length / 400);

        // Si 95% est gratté : On finit proprement
        if (progress > 0.95) {
            if (phase === 1) {
                completePhase1();
            } else if (phase === 2) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }
    }

    function completePhase1() {
        locked = true;
        flash.classList.add('flash-anim');
        ctxTop.clearRect(0, 0, cTop.width, cTop.height); // Nettoie le noir
        
        setTimeout(() => {
            flash.classList.remove('flash-anim');
            cTop.style.display = 'none'; // Détruit la couche noire
            phase = 2; // On peut maintenant gratter l'image 1
            setTimeout(() => { locked = false; }, 4200); // 5s total avec le flash
        }, 800);
    }

    function scratch(x, y) {
        if (locked) return;
        
        const currentCtx = (phase === 1) ? ctxTop : ctxMid;
        const currentCanvas = (phase === 1) ? cTop : cMid;

        // Croissance du pinceau
        if (brushSize < maxSize) brushSize += growth;
        
        // Mise à jour curseur visuel
        cursor.style.width = brushSize + 'px';
        cursor.style.height = brushSize + 'px';
        cursor.style.left = x + 'px';
        cursor.style.top = y + 'px';
        cursor.style.display = 'block';

        currentCtx.globalCompositeOperation = 'destination-out';
        currentCtx.lineJoin = 'round';
        currentCtx.lineCap = 'round';
        currentCtx.lineWidth = brushSize;

        if (lastPoint) {
            currentCtx.beginPath();
            currentCtx.moveTo(lastPoint.x, lastPoint.y);
            currentCtx.lineTo(x, y);
            currentCtx.stroke();
        }
        lastPoint = { x, y };

        // Vérification automatique toutes les 10 actions
        if (Math.random() > 0.9) checkCompletion(currentCtx, currentCanvas);
    }

    function getPos(e) {
        const rect = container.getBoundingClientRect();
        const pos = e.touches ? e.touches[0] : e;
        return { x: pos.clientX - rect.left, y: pos.clientY - rect.top };
    }

    const onStart = (e) => {
        if (locked) return;
        isDrawing = true;
        brushSize = minSize;
        const p = getPos(e);
        lastPoint = p;
        scratch(p.x, p.y);
    };

    const onMove = (e) => {
        if (!isDrawing || locked) return;
        if (e.cancelable) e.preventDefault();
        const p = getPos(e);
        scratch(p.x, p.y);
    };

    const onStop = () => {
        isDrawing = false;
        lastPoint = null;
        cursor.style.display = 'none';
        if (!locked) {
            const currentCtx = (phase === 1) ? ctxTop : ctxMid;
            const currentCanvas = (phase === 1) ? cTop : cMid;
            checkCompletion(currentCtx, currentCanvas);
        }
    };

    container.addEventListener('mousedown', onStart);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onStop);

    container.addEventListener('touchstart', onStart, {passive: false});
    window.addEventListener('touchmove', onMove, {passive: false});
    window.addEventListener('touchend', onStop);

</script>
</body>
</html>
