<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>L'Énigme du Double Voile</title>
    <style>
        body {
            display: flex; justify-content: center; align-items: center;
            height: 100vh; margin: 0; background-color: #000;
            overflow: hidden; touch-action: none;
        }

        #game-container {
            position: relative; width: 320px; height: 450px;
            background-image: url('Imprim.jpg'); /* IMAGE 2 TOUT AU FOND */
            background-size: cover; background-position: center;
            border-radius: 8px; filter: blur(25px); /* Image 2 ultra floue au début */
            transition: filter 0.4s ease;
        }

        canvas { position: absolute; top: 0; left: 0; transition: filter 0.4s ease, opacity 0.8s ease; }
        
        #canvas-layer-1 { z-index: 2; filter: blur(15px); } /* IMAGE 1 - Floue au début */
        #canvas-layer-top { z-index: 3; } /* VOILE NOIR */

        #flash {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: white; opacity: 0; z-index: 10; pointer-events: none;
        }

        .flash-anim { animation: flash-effect 0.7s ease-out; }
        @keyframes flash-effect {
            0% { opacity: 0; } 25% { opacity: 1; } 100% { opacity: 0; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="flash"></div>
    <canvas id="canvas-layer-1"></canvas>
    <canvas id="canvas-layer-top"></canvas>
</div>

<script>
    const container = document.getElementById('game-container');
    const cTop = document.getElementById('canvas-layer-top');
    const ctxTop = cTop.getContext('2d');
    const cMid = document.getElementById('canvas-layer-1');
    const ctxMid = cMid.getContext('2d');
    const flash = document.getElementById('flash');

    let isDrawing = false;
    let lastPoint = null;
    let brushSize = 4;
    let phase = 1; 
    
    const growthSpeed = 0.15; // Vitesse d'agrandissement lente quand le doigt reste
    const minBrush = 4;
    const maxBrush = 70;

    const img1 = new Image();
    img1.src = 'IMG1.jpeg';

    img1.onload = function() {
        [cTop, cMid].forEach(c => { 
            c.width = container.offsetWidth; 
            c.height = container.offsetHeight; 
        });
        // On dessine l'image 1 sur son calque
        ctxMid.drawImage(img1, 0, 0, cMid.width, cMid.height);
        
        // On dessine le voile noir opaque par-dessus tout
        ctxTop.fillStyle = "#000000";
        ctxTop.fillRect(0, 0, cTop.width, cTop.height);
    };

    function updateBlurLevels(progress) {
        const remaining = 1 - progress;
        if (phase === 1) {
            // Plus on gratte le noir, plus l'Image 1 (Milieu) devient nette
            cMid.style.filter = `blur(${remaining * 15}px)`;
            // Le fond (Image 2) reste très flou en phase 1
            container.style.filter = `blur(25px)`;
        } else {
            // Phase 2 : L'image 1 est déjà nette, on fait déflouter le fond (Image 2)
            container.style.filter = `blur(${remaining * 25}px)`;
        }
    }

    function triggerFlash() {
        flash.classList.add('flash-anim');
        setTimeout(() => flash.classList.remove('flash-anim'), 700);
    }

    function checkProgress() {
        // On analyse le calque correspondant à la phase actuelle
        const currentCtx = (phase === 1) ? ctxTop : ctxMid;
        const pixels = currentCtx.getImageData(0, 0, cMid.width, cMid.height).data;
        let transparent = 0;
        for (let i = 3; i < pixels.length; i += 150) { 
            if (pixels[i] === 0) transparent++; 
        }
        const progress = transparent / (pixels.length / 150);

        if (phase === 1 && progress > 0.97) {
            triggerFlash();
            phase = 2;
            cTop.style.display = 'none'; // Le noir disparaît totalement
            cMid.style.filter = 'blur(0px)'; // L'image 1 est figée nette
        } else {
            updateBlurLevels(progress);
        }
    }

    function scratch(x, y) {
        const currentCtx = (phase === 1) ? ctxTop : ctxMid;

        // Le pinceau grossit si le doigt ne se lève pas
        if (brushSize < maxBrush) brushSize += growthSpeed;

        currentCtx.globalCompositeOperation = 'destination-out';
        currentCtx.lineJoin = 'round'; 
        currentCtx.lineCap = 'round';
        currentCtx.lineWidth = brushSize;

        if (lastPoint) {
            currentCtx.beginPath(); 
            currentCtx.moveTo(lastPoint.x, lastPoint.y);
            currentCtx.lineTo(x, y); 
            currentCtx.stroke();
        } else {
            currentCtx.beginPath(); 
            currentCtx.arc(x, y, brushSize/2, 0, Math.PI*2); 
            currentCtx.fill();
        }
        lastPoint = { x, y };
    }

    const handleInput = (e) => {
        if (!isDrawing) return;
        if (e.cancelable) e.preventDefault();
        const rect = cMid.getBoundingClientRect();
        const pos = e.touches ? e.touches[0] : e;
        const x = pos.clientX - rect.left;
        const y = pos.clientY - rect.top;
        
        scratch(x, y);
        
        // On vérifie la progression régulièrement
        if (Math.random() > 0.9) checkProgress();
    };

    const start = (e) => { 
        isDrawing = true; 
        brushSize = minBrush; // Réinitialise tout petit au contact
        lastPoint = null; 
        handleInput(e); 
    };
    
    const stop = () => { 
        isDrawing = false; 
        lastPoint = null; 
        brushSize = minBrush; // Réinitialise pour le prochain toucher
        checkProgress(); 
    };

    // Listeners sur les deux calques
    [cTop, cMid].forEach(c => {
        c.addEventListener('mousedown', start);
        c.addEventListener('touchstart', start, {passive: false});
    });

    window.addEventListener('mousemove', handleInput);
    window.addEventListener('touchmove', handleInput, {passive: false});
    window.addEventListener('mouseup', stop);
    window.addEventListener('touchend', stop);

</script>
</body>
</html>
