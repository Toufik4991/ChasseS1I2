<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Le Mystère des Deux Voiles</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #020202;
            font-family: sans-serif;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 320px;  
            height: 450px;
            /* L'image de fond est floue au départ */
            background-image: url('Imprim.jpg'); 
            background-size: cover;
            background-position: center;
            filter: blur(10px); 
            border-radius: 10px;
            transition: filter 2s ease;
        }

        /* Quand on a bien gratté, le fond devient net */
        #game-container.revealed {
            filter: blur(0px);
        }

        canvas {
            position: absolute;
            top: 0; left: 0;
            touch-action: none; 
            cursor: crosshair;
            /* L'image du dessus est aussi floue */
            filter: blur(6px);
            transition: opacity 1s ease;
        }

        #hint {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255,255,255,0.4);
            font-size: 11px;
            letter-spacing: 2px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="scratchCard"></canvas>
        <div id="hint">Maintenez pour voir plus clair...</div>
    </div>

    <script>
        const canvas = document.getElementById('scratchCard');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('game-container');
        
        let isDrawing = false;
        let lastPoint = null;
        let brushSize = 4; // Taille initiale (tout petit pixel)
        const minBrush = 4;
        const maxBrush = 45;

        const topImage = new Image();
        topImage.src = 'IMG1.jpeg'; 

        topImage.onload = function() {
            canvas.width = container.offsetWidth;
            canvas.height = container.offsetHeight;
            
            // Dessin de l'image de couverture
            ctx.drawImage(topImage, 0, 0, canvas.width, canvas.height);
            
            // Ajout d'un voile sombre pour cacher le flou de l'image 1
            ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        };

        function scratch(x, y) {
            ctx.globalCompositeOperation = 'destination-out';
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            
            // LOGIQUE DE GROSSISSEMENT : Plus on gratte sans lâcher, plus ça grossit
            if (brushSize < maxBrush) {
                brushSize += 0.8; 
            }
            
            ctx.lineWidth = brushSize;

            if (lastPoint) {
                ctx.beginPath();
                ctx.moveTo(lastPoint.x, lastPoint.y);
                ctx.lineTo(x, y);
                ctx.stroke();
            } else {
                ctx.beginPath();
                ctx.arc(x, y, brushSize / 2, 0, Math.PI * 2);
                ctx.fill();
            }
            lastPoint = { x, y };

            // Analyse de la progression
            if (Math.random() > 0.95) checkProgress();
        }

        function checkProgress() {
            const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            let total = 0;
            for (let i = 3; i < data.length; i += 40) {
                if (data[i] === 0) total++;
            }
            // Si on a gratté plus de 40%, on rend le fond net
            if (total > (data.length / 40) * 0.4) {
                container.classList.add('revealed');
                canvas.style.opacity = "0";
            }
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const cy = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: cx - rect.left, y: cy - rect.top };
        }

        const start = (e) => {
            isDrawing = true;
            brushSize = minBrush; // RÉINITIALISATION à chaque fois que le doigt se pose
            const pos = getPos(e);
            scratch(pos.x, pos.y);
        };

        const move = (e) => {
            if (!isDrawing) return;
            if (e.cancelable) e.preventDefault();
            const pos = getPos(e);
            scratch(pos.x, pos.y);
        };

        const stop = () => {
            isDrawing = false;
            lastPoint = null;
            brushSize = minBrush; // RÉINITIALISATION quand le doigt se lève
        };

        canvas.addEventListener('mousedown', start);
        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', stop);
        
        canvas.addEventListener('touchstart', start, { passive: false });
        canvas.addEventListener('touchmove', move, { passive: false });
        window.addEventListener('touchend', stop);
    </script>
</body>
</html>
