<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Double Grattage Mystère</title>
    <style>
        body {
            display: flex; justify-content: center; align-items: center;
            height: 100vh; margin: 0; background-color: #000;
            overflow: hidden; touch-action: none;
        }

        #game-container {
            position: relative; width: 320px; height: 450px;
            background-image: url('Imprim.jpg');
            background-size: cover; background-position: center;
            border-radius: 8px; transition: filter 0.3s ease;
        }

        canvas { position: absolute; top: 0; left: 0; transition: filter 0.3s ease, opacity 0.5s ease; }
        
        #canvas-layer-1 { z-index: 2; } /* Image 1 */
        #canvas-layer-top { z-index: 3; } /* Voile Noir */

        /* Effet de Flash */
        #flash {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: white; opacity: 0; z-index: 10; pointer-events: none;
        }

        .flash-anim { animation: flash-effect 0.6s ease-out; }
        @keyframes flash-effect {
            0% { opacity: 0; } 20% { opacity: 1; } 100% { opacity: 0; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="flash"></div>
    <canvas id="canvas-layer-1"></canvas>
    <canvas id="canvas-layer-top"></canvas>
</div>

<script>
    const container = document.getElementById('game-container');
    const cTop = document.getElementById('canvas-layer-top');
    const ctxTop = cTop.getContext('2d');
    const cMid = document.getElementById('canvas-layer-1');
    const ctxMid = cMid.getContext('2d');
    const flash = document.getElementById('flash');

    let isDrawing = false;
    let lastPoint = null;
    let brushSize = 4;
    let phase = 1; // Phase 1: Voile Noir | Phase 2: Image 1
    
    const growthSpeed = 0.15;
    const minBrush = 4;
    const maxBrush = 60;

    const img1 = new Image();
    img1.src = 'IMG1.jpeg';

    img1.onload = function() {
        [cTop, cMid].forEach(c => { 
            c.width = container.offsetWidth; 
            c.height = container.offsetHeight; 
        });
        ctxMid.drawImage(img1, 0, 0, cMid.width, cMid.height);
        ctxTop.fillStyle = "#000000";
        ctxTop.fillRect(0, 0, cTop.width, cTop.height);
        updateVisuals(0);
    };

    function updateVisuals(percent) {
        const rev = 1 - percent;
        if (phase === 1) {
            cMid.style.filter = `blur(${rev * 15}px)`;
            cTop.style.opacity = rev > 0.05 ? rev : 0;
            container.style.filter = `blur(20px)`; // Fond reste flou
        } else {
            container.style.filter = `blur(${rev * 20}px)`;
        }
    }

    function triggerFlash() {
        flash.classList.add('flash-anim');
        setTimeout(() => flash.classList.remove('flash-anim'), 600);
    }

    function checkProgress() {
        const targetCtx = (phase === 1) ? ctxTop : ctxMid;
        const pixels = targetCtx.getImageData(0, 0, cMid.width, cMid.height).data;
        let transparent = 0;
        for (let i = 3; i < pixels.length; i += 100) { if (pixels[i] === 0) transparent++; }
        const progress = transparent / (pixels.length / 100);

        if (phase === 1 && progress > 0.96) {
            triggerFlash();
            phase = 2;
            cTop.style.display = 'none'; // Supprime le voile noir
            cMid.style.filter = 'blur(0px)'; // Image 1 devient nette
            updateVisuals(0); // Reset pour le fond (phase 2)
        } else {
            updateVisuals(progress);
        }
    }

    function scratch(x, y) {
        const currentCtx = (phase === 1) ? ctxTop : ctxMid;
        // En phase 1, on peut aussi gratter la couche 1 en même temps pour préparer le terrain
        const contexts = (phase === 1) ? [ctxTop, ctxMid] : [ctxMid];

        if (brushSize < maxBrush) brushSize += growthSpeed;

        contexts.forEach(ctx => {
            ctx.globalCompositeOperation = 'destination-out';
            ctx.lineJoin = 'round'; ctx.lineCap = 'round';
            ctx.lineWidth = brushSize;
            if (lastPoint) {
                ctx.beginPath(); ctx.moveTo(lastPoint.x, lastPoint.y);
                ctx.lineTo(x, y); ctx.stroke();
            } else {
                ctx.beginPath(); ctx.arc(x, y, brushSize/2, 0, Math.PI*2); ctx.fill();
            }
        });
        lastPoint = { x, y };
    }

    const handleInput = (e) => {
        if (!isDrawing) return;
        if (e.cancelable) e.preventDefault();
        const rect = cMid.getBoundingClientRect();
        const pos = e.touches ? e.touches[0] : e;
        const x = pos.clientX - rect.left;
        const y = pos.clientY - rect.top;
        scratch(x, y);
        if (Math.random() > 0.9) checkProgress();
    };

    const start = (e) => { isDrawing = true; brushSize = minBrush; lastPoint = null; handleInput(e); };
    const stop = () => { isDrawing = false; lastPoint = null; brushSize = minBrush; checkProgress(); };

    [cTop, cMid].forEach(c => {
        c.addEventListener('mousedown', start);
        c.addEventListener('touchstart', start, {passive: false});
    });
    window.addEventListener('mousemove', handleInput);
    window.addEventListener('touchmove', handleInput, {passive: false});
    window.addEventListener('mouseup', stop);
    window.addEventListener('touchend', stop);

</script>
</body>
</html>
