<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Jeu à gratter</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            /* C'est ici que je change la couleur du fond de la page */
            background-color: #e0e0e0; 
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            /* Taille de la zone à gratter */
            width: 300px;  
            height: 400px;
            /* Ombre pour faire ressortir le carré noir */
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            overflow: hidden;
            
            /* TON IMAGE EN DESSOUS */
            background-image: url('Imprim.jpg'); 
            background-size: cover;
            background-position: center;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            touch-action: none; 
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="scratchCard"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('scratchCard');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('game-container');
        
        let isDrawing = false;
        
        // --- REGLAGE TAILLE ---
        // Rayon de 2 pixels = largeur totale du trait de 4 pixels
        const brushRadius = 2; 

        function resizeCanvas() {
            canvas.width = container.offsetWidth;
            canvas.height = container.offsetHeight;
            
            // --- COULEUR A GRATTER ---
            // Ici on met le noir pur (#000000) uniquement sur la zone de jeu
            ctx.fillStyle = '#000000'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function scratch(x, y) {
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(x, y, brushRadius, 0, Math.PI * 2);
            ctx.fill();
        }

        // --- SOURIS (Ordinateur) ---
        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            scratch(e.offsetX, e.offsetY);
        });
        canvas.addEventListener('mousemove', (e) => {
            if (isDrawing) scratch(e.offsetX, e.offsetY);
        });
        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mouseleave', () => isDrawing = false);

        // --- TACTILE (Téléphone) ---
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            scratch(touch.clientX - rect.left, touch.clientY - rect.top);
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault(); 
            if (isDrawing) {
                const rect = canvas.getBoundingClientRect();
                const touch = e.touches[0];
                scratch(touch.clientX - rect.left, touch.clientY - rect.top);
            }
        }, { passive: false });

        canvas.addEventListener('touchend', () => isDrawing = false);

        // Lancement immédiat
        window.onload = resizeCanvas;
    </script>

</body>
</html>
